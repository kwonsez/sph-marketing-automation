name: Weekly Marketing Report

on:
  schedule:
    # 매주 월요일 KST 09:00 도착 목표 (GitHub Actions 지연 고려, KST 08:45 예약)
    # UTC 기준 일요일 23:45 = KST 월요일 08:45
    - cron: "45 23 * * 0"
  workflow_dispatch:
    inputs:
      date:
        description: "대상 주차 월요일 (YYYY-MM-DD). 비워두면 지난주 자동 계산."
        required: false
        type: string
      dry_run:
        description: "Dry Run (Monday.com에 쓰지 않음)"
        required: false
        type: boolean
        default: false

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치
        run: playwright install chromium --with-deps

      - name: 서비스 계정 키 복원
        run: echo '${{ secrets.GOOGLE_SA_JSON }}' > service-account.json

      # ── 네이버 세션 복원 ──────────────────────────────────────
      # 매 실행마다 연장된 세션을 cache에 저장하고, 다음 실행이 이어받는다.
      # (매주 실행이 쿠키를 회전 발급받아 재저장 → 최초 로그인 1회로 계속 유지)
      # Secret(NAVER_SESSION_JSON)은 최초 시드 + cache 유실 시 fallback.
      # cache 키에 Secret 해시를 포함해, Secret을 새로 등록하면(=재로그인하면)
      # 이전 lineage의 낡은 cache를 자동으로 무시하고 새 세션부터 다시 시작한다.
      - name: 네이버 세션 시드 준비 (Secret)
        id: session-seed
        run: |
          echo '${{ secrets.NAVER_SESSION_JSON }}' > naver_session_seed.json
          echo "hash=$(sha256sum naver_session_seed.json | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: 네이버 세션 복원 (지난 실행에서 연장된 세션)
        uses: actions/cache/restore@v4
        with:
          path: naver_session.json
          key: naver-session-${{ steps.session-seed.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            naver-session-${{ steps.session-seed.outputs.hash }}-

      - name: 캐시 미스 시 Secret 세션 사용
        run: |
          if [ -f naver_session.json ]; then
            echo "✅ cache에서 연장된 세션 복원"
          else
            cp naver_session_seed.json naver_session.json
            echo "ℹ️ cache 없음 → Secret 세션으로 시작"
          fi
          rm -f naver_session_seed.json

      - name: 리포트 실행
        env:
          # Monday.com
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_WEEKLY_BOARD_ID: ${{ vars.MONDAY_WEEKLY_BOARD_ID }}
          MONDAY_LEAD_BOARD_IDS: ${{ vars.MONDAY_LEAD_BOARD_IDS }}
          MONDAY_COL_START_DATE: ${{ vars.MONDAY_COL_START_DATE }}
          MONDAY_COL_LEAD_GEN: ${{ vars.MONDAY_COL_LEAD_GEN }}
          MONDAY_COL_WAU: ${{ vars.MONDAY_COL_WAU }}
          MONDAY_COL_CONTACT_USERS: ${{ vars.MONDAY_COL_CONTACT_USERS }}
          MONDAY_COL_G_IMPRESSIONS: ${{ vars.MONDAY_COL_G_IMPRESSIONS }}
          MONDAY_COL_G_CLICKS: ${{ vars.MONDAY_COL_G_CLICKS }}
          MONDAY_COL_G_COST: ${{ vars.MONDAY_COL_G_COST }}
          MONDAY_COL_WOW_CONVERSION: ${{ vars.MONDAY_COL_WOW_CONVERSION }}
          MONDAY_COL_WOW_GCTR: ${{ vars.MONDAY_COL_WOW_GCTR }}
          MONDAY_COL_N_IMPRESSIONS: ${{ vars.MONDAY_COL_N_IMPRESSIONS }}
          MONDAY_COL_N_CLICKS: ${{ vars.MONDAY_COL_N_CLICKS }}
          MONDAY_COL_N_COST: ${{ vars.MONDAY_COL_N_COST }}
          MONDAY_COL_WOW_NCTR: ${{ vars.MONDAY_COL_WOW_NCTR }}
          MONDAY_COL_N_BLOG_POSTS: ${{ vars.MONDAY_COL_N_BLOG_POSTS }}
          MONDAY_COL_N_BLOG_VIEWS: ${{ vars.MONDAY_COL_N_BLOG_VIEWS }}
          MONDAY_COL_WOW_NAVER: ${{ vars.MONDAY_COL_WOW_NAVER }}
          # GA4
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ./service-account.json
          CONTACT_PATH: ${{ vars.CONTACT_PATH }}
          # BIVIZ Weekly Report
          MONDAY_BIVIZ_BOARD_ID: ${{ vars.MONDAY_BIVIZ_BOARD_ID }}
          MONDAY_BIVIZ_LEAD_BOARD_IDS: ${{ vars.MONDAY_BIVIZ_LEAD_BOARD_IDS }}
          MONDAY_BIVIZ_COL_START_DATE: ${{ vars.MONDAY_BIVIZ_COL_START_DATE }}
          MONDAY_BIVIZ_COL_LEAD_GEN: ${{ vars.MONDAY_BIVIZ_COL_LEAD_GEN }}
          MONDAY_BIVIZ_COL_WAU: ${{ vars.MONDAY_BIVIZ_COL_WAU }}
          MONDAY_BIVIZ_COL_CONTACT_USERS: ${{ vars.MONDAY_BIVIZ_COL_CONTACT_USERS }}
          MONDAY_BIVIZ_COL_WOW_CONVERSION: ${{ vars.MONDAY_BIVIZ_COL_WOW_CONVERSION }}
          BIVIZ_GA4_PROPERTY_ID: ${{ secrets.BIVIZ_GA4_PROPERTY_ID }}
          BIVIZ_CONTACT_PATH: ${{ vars.BIVIZ_CONTACT_PATH }}
          # Google Ads
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ vars.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ vars.GOOGLE_ADS_CUSTOMER_ID }}
          # 네이버 검색광고
          NAVER_ADS_API_KEY: ${{ secrets.NAVER_ADS_API_KEY }}
          NAVER_ADS_SECRET_KEY: ${{ secrets.NAVER_ADS_SECRET_KEY }}
          NAVER_ADS_CUSTOMER_ID: ${{ vars.NAVER_ADS_CUSTOMER_ID }}
          # 네이버 블로그
          NAVER_LOGIN_ID: ${{ secrets.NAVER_LOGIN_ID }}
          NAVER_LOGIN_PW: ${{ secrets.NAVER_LOGIN_PW }}
          NAVER_BLOG_ID: ${{ vars.NAVER_BLOG_ID }}
          # Gmail
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python main.py $ARGS

      # 리포트가 실패해도 수집 과정에서 연장된 세션은 저장해 다음 실행에 잇는다.
      # (세션 만료 시엔 collector가 파일을 덮어쓰지 않으므로 낡은 쿠키가 저장될 뿐,
      #  재로그인 후 Secret을 갱신하면 키의 해시가 바뀌어 자동으로 무시된다)
      - name: 연장된 네이버 세션 저장 (다음 실행용)
        if: always() && hashFiles('naver_session.json') != ''
        uses: actions/cache/save@v4
        with:
          path: naver_session.json
          key: naver-session-${{ steps.session-seed.outputs.hash }}-${{ github.run_id }}

      - name: 로그 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: automation-log
          path: automation.log
          retention-days: 7

      - name: 스크린샷 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
          retention-days: 7
          if-no-files-found: ignore
